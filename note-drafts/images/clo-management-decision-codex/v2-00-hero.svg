<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CLO義務化を見据えて支援アプリを作った</title>
  <desc id="desc">物流システムエンジニアの調査と実装ログを示すnote記事カバー画像。CLO義務化、個人開発、公的データ統合、Claude Codeをキーワードとして配置。</desc>
  <defs>
    <style>
      text { font-family: 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif; }
      .navy { fill: #0F1F3D; }
      .white { fill: #FFFFFF; }
      .pale { fill: #DCE4EF; }
      .gold { fill: #C99A2E; }
      .muted { fill: #A9B4C5; }
    </style>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1F3D"/>
      <stop offset="62%" stop-color="#122848"/>
      <stop offset="100%" stop-color="#24496B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="78%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#C99A2E" stop-opacity="0.28"/>
      <stop offset="64%" stop-color="#C99A2E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C99A2E" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030A18" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="url(#heroGradient)"/>
    <rect width="1280" height="720" fill="url(#goldGlow)"/>
    <path d="M0 574 C210 522 400 622 592 560 C826 486 1018 514 1280 430 L1280 720 L0 720 Z" fill="#08152B" opacity="0.38"/>
    <path d="M65 150 H1215 M65 246 H1215 M65 342 H1215 M65 438 H1215 M65 534 H1215" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M170 74 V646 M356 74 V646 M542 74 V646 M728 74 V646 M914 74 V646 M1100 74 V646" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M904 134 L1192 134 L1192 414 L904 414 Z" fill="none" stroke="#C99A2E" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M934 104 L1222 104 L1222 384" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="1064" cy="266" r="92" fill="none" stroke="#C99A2E" stroke-opacity="0.22" stroke-width="22"/>
    <circle cx="1064" cy="266" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2"/>
  </g>

  <g id="main-copy" filter="url(#heroShadow)">
    <rect x="64" y="88" width="742" height="42" rx="4" fill="#C99A2E"/>
    <text x="86" y="117" fill="#0F1F3D" font-size="21" font-weight="800">調査と実装で考えるCLO対応</text>

    <text x="64" y="226" class="white" font-size="58" font-weight="800">
      <tspan x="64" dy="0">CLO義務化を見据えて</tspan>
      <tspan x="64" dy="74">支援アプリを作った</tspan>
    </text>
    <rect x="64" y="340" width="676" height="3" fill="#C99A2E"/>
    <text x="64" y="394" class="pale" font-size="32" font-weight="700">物流システムエンジニアの調査と実装ログ</text>
  </g>

  <g id="message">
    <rect x="64" y="454" width="812" height="78" rx="6" fill="#FFFFFF" opacity="0.09"/>
    <rect x="64" y="454" width="8" height="78" fill="#C99A2E"/>
    <text x="94" y="503" class="white" font-size="28" font-weight="700">書類作成ではなく、施策を選ぶための判断材料を</text>
  </g>

  <g id="badges">
    <rect x="64" y="584" width="186" height="44" rx="4" fill="none" stroke="#C99A2E" stroke-width="2"/>
    <text x="157" y="613" class="pale" font-size="19" font-weight="700" text-anchor="middle">物流2026年問題</text>
    <rect x="270" y="584" width="126" height="44" rx="4" fill="none" stroke="#C99A2E" stroke-width="2"/>
    <text x="333" y="613" class="pale" font-size="19" font-weight="700" text-anchor="middle">個人開発</text>
    <rect x="416" y="584" width="190" height="44" rx="4" fill="none" stroke="#C99A2E" stroke-width="2"/>
    <text x="511" y="613" class="pale" font-size="19" font-weight="700" text-anchor="middle">公的データ統合</text>
    <rect x="626" y="584" width="154" height="44" rx="4" fill="none" stroke="#C99A2E" stroke-width="2"/>
    <text x="703" y="613" class="pale" font-size="19" font-weight="700" text-anchor="middle">Claude Code</text>
  </g>

  <g id="right-panel">
    <rect x="912" y="188" width="244" height="286" rx="6" fill="#FFFFFF" opacity="0.10"/>
    <rect x="912" y="188" width="244" height="8" fill="#C99A2E"/>
    <text x="940" y="244" class="white" font-size="25" font-weight="800">CLO</text>
    <text x="940" y="288" class="pale" font-size="19" font-weight="700">義務化</text>
    <text x="940" y="328" class="muted" font-size="17">公的データ</text>
    <text x="940" y="364" class="muted" font-size="17">施策優先順位</text>
    <text x="940" y="400" class="muted" font-size="17">説明可能性</text>
    <path d="M940 430 H1114" stroke="#C99A2E" stroke-width="3"/>
  </g>

  <g id="footer">
    <text x="1216" y="676" fill="#A9B4C5" font-size="16" text-anchor="end">note cover / CLO management decision support app</text>
  </g>
</svg>
