<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">書類フォーマットだけでは絶対に解けない3つの課題</title>
  <desc id="desc">CLO業務の難所として、投資しない理由の説明責任、部門間と取引先の調整、継続運用と説明可能性を示す3カード図。</desc>
  <defs>
    <style>
      text { font-family: 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif; }
      .navy { fill: #0F1F3D; }
      .ink { fill: #172239; }
      .muted { fill: #677282; }
      .white { fill: #FFFFFF; }
      .gold { fill: #C99A2E; }
    </style>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F1F3D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#F5F7FA"/>
    <rect x="0" y="0" width="1280" height="114" class="navy"/>
    <rect x="0" y="114" width="1280" height="6" class="gold"/>
  </g>

  <g id="header">
    <text x="64" y="68" class="white" font-size="34" font-weight="700">書類フォーマットだけでは絶対に解けない3つの課題</text>
    <text x="64" y="96" fill="#DCE4EF" font-size="18">CLOは記入担当ではなく、説明と調整を担う経営機能</text>
  </g>

  <g id="cards" filter="url(#cardShadow)">
    <g id="card-investment">
      <rect x="64" y="170" width="360" height="390" rx="6" fill="#FFFFFF"/>
      <rect x="64" y="170" width="360" height="72" rx="6" fill="#0F1F3D"/>
      <text x="94" y="219" class="white" font-size="24" font-weight="700">1. 「投資しない理由」</text>
      <text x="94" y="294" class="ink" font-size="26" font-weight="700">説明責任</text>
      <line x1="94" y1="318" x2="394" y2="318" stroke="#C99A2E" stroke-width="3"/>
      <text x="94" y="362" class="muted" font-size="20">
        <tspan x="94" dy="0">モーダルシフト/共同配送/</tspan>
        <tspan x="94" dy="34">バース予約など、選外の理由を</tspan>
        <tspan x="94" dy="34">取締役会・投資家対話で説明</tspan>
      </text>
    </g>

    <g id="card-coordination">
      <rect x="460" y="170" width="360" height="390" rx="6" fill="#FFFFFF"/>
      <rect x="460" y="170" width="360" height="72" rx="6" fill="#24496B"/>
      <text x="490" y="219" class="white" font-size="24" font-weight="700">2. 部門間と取引先の調整</text>
      <text x="490" y="294" class="ink" font-size="26" font-weight="700">物流部門単独では動かない</text>
      <line x1="490" y1="318" x2="790" y2="318" stroke="#C99A2E" stroke-width="3"/>
      <text x="490" y="362" class="muted" font-size="20">
        <tspan x="490" dy="0">開発・調達・生産・販売・在庫</tspan>
        <tspan x="490" dy="34">の各部門連携。物流部門単独</tspan>
        <tspan x="490" dy="34">では納品条件は変わらない</tspan>
      </text>
    </g>

    <g id="card-operation">
      <rect x="856" y="170" width="360" height="390" rx="6" fill="#FFFFFF"/>
      <rect x="856" y="170" width="360" height="72" rx="6" fill="#53606E"/>
      <text x="886" y="219" class="white" font-size="24" font-weight="700">3. 継続運用と説明可能性</text>
      <text x="886" y="294" class="ink" font-size="26" font-weight="700">毎年説明できる構造</text>
      <line x1="886" y1="318" x2="1186" y2="318" stroke="#C99A2E" stroke-width="3"/>
      <text x="886" y="360" class="muted" font-size="19">
        <tspan x="886" dy="0">中長期計画は5年に1度・</tspan>
        <tspan x="886" dy="32">定期報告は毎年。全数値に出典。</tspan>
        <tspan x="886" dy="32">積載率の分母・CO2係数の出所</tspan>
        <tspan x="886" dy="32">まで遡れる構造が必要</tspan>
      </text>
    </g>
  </g>

  <g id="bottom-rule">
    <rect x="64" y="604" width="1152" height="2" fill="#D8DEE8"/>
    <text x="64" y="642" fill="#0F1F3D" font-size="22" font-weight="700">論点は、フォーマット入力ではなく「なぜその施策か」を説明できるか</text>
  </g>

  <g id="source">
    <text x="1216" y="684" fill="#687386" font-size="15" text-anchor="end">出典：経産省「CLO取組事例集」（2026年2月）／記載事例集（2026年3月）</text>
  </g>
</svg>
