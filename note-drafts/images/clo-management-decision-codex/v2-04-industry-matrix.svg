<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">業種別CLO標準パッケージ：4業種×5要素</title>
  <desc id="desc">製造業、卸売業、小売業、連鎖化事業者について、推奨KPI、中核施策、月次会議議題、定期報告データ、個社差分の例を整理した表。</desc>
  <defs>
    <style>
      text { font-family: 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif; }
      .navy { fill: #0F1F3D; }
      .ink { fill: #172239; }
      .muted { fill: #647083; }
      .white { fill: #FFFFFF; }
      .gold { fill: #C99A2E; }
      .grid { stroke: #D6DCE6; stroke-width: 1.4; }
    </style>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#F5F7FA"/>
    <rect x="0" y="0" width="1280" height="104" class="navy"/>
    <rect x="0" y="104" width="1280" height="6" class="gold"/>
  </g>

  <g id="header">
    <text x="64" y="66" class="white" font-size="36" font-weight="700">業種別CLO標準パッケージ：4業種×5要素</text>
    <text x="64" y="94" fill="#DCE4EF" font-size="17">同じCLO対応でも、見るべきKPIと会議体は業種で変わる</text>
  </g>

  <g id="matrix">
    <rect x="42" y="144" width="1196" height="480" rx="4" fill="#FFFFFF"/>
    <rect x="42" y="144" width="1196" height="70" rx="4" fill="#0F1F3D"/>

    <line x1="164" y1="144" x2="164" y2="624" class="grid"/>
    <line x1="356" y1="144" x2="356" y2="624" class="grid"/>
    <line x1="560" y1="144" x2="560" y2="624" class="grid"/>
    <line x1="778" y1="144" x2="778" y2="624" class="grid"/>
    <line x1="986" y1="144" x2="986" y2="624" class="grid"/>
    <line x1="42" y1="214" x2="1238" y2="214" class="grid"/>
    <line x1="42" y1="316" x2="1238" y2="316" class="grid"/>
    <line x1="42" y1="418" x2="1238" y2="418" class="grid"/>
    <line x1="42" y1="520" x2="1238" y2="520" class="grid"/>

    <text x="103" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">業種</text>
    <text x="260" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">推奨KPI</text>
    <text x="458" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">中核施策</text>
    <text x="669" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">月次会議議題</text>
    <text x="882" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">定期報告データ</text>
    <text x="1112" y="188" class="white" font-size="21" font-weight="700" text-anchor="middle">個社差分の例</text>

    <rect x="42" y="214" width="1196" height="102" fill="#F9FAFC"/>
    <text x="103" y="273" class="ink" font-size="21" font-weight="700" text-anchor="middle">製造業</text>
    <text x="260" y="273" class="ink" font-size="20" text-anchor="middle">出荷波形平準化</text>
    <text x="458" y="261" class="ink" font-size="19" text-anchor="middle">ミルクラン／</text>
    <text x="458" y="291" class="ink" font-size="19" text-anchor="middle">生産物流同期</text>
    <text x="669" y="273" class="ink" font-size="20" text-anchor="middle">生産物流連携会議</text>
    <text x="882" y="273" class="ink" font-size="20" text-anchor="middle">荷姿標準化進捗</text>
    <text x="1112" y="273" class="ink" font-size="20" text-anchor="middle">拠点配置</text>

    <text x="103" y="375" class="ink" font-size="21" font-weight="700" text-anchor="middle">卸売業</text>
    <text x="260" y="375" class="ink" font-size="20" text-anchor="middle">拠点別積載率</text>
    <text x="458" y="375" class="ink" font-size="20" text-anchor="middle">共同配送</text>
    <text x="669" y="375" class="ink" font-size="20" text-anchor="middle">拠点別物流会議</text>
    <text x="882" y="375" class="ink" font-size="20" text-anchor="middle">配送頻度別実績</text>
    <text x="1112" y="375" class="ink" font-size="20" text-anchor="middle">取引先構造</text>

    <rect x="42" y="418" width="1196" height="102" fill="#F9FAFC"/>
    <text x="103" y="477" class="ink" font-size="21" font-weight="700" text-anchor="middle">小売業</text>
    <text x="260" y="477" class="ink" font-size="20" text-anchor="middle">バース回転率</text>
    <text x="458" y="477" class="ink" font-size="20" text-anchor="middle">バース予約</text>
    <text x="669" y="477" class="ink" font-size="20" text-anchor="middle">納品時間調整会議</text>
    <text x="882" y="477" class="ink" font-size="20" text-anchor="middle">バース回転実績</text>
    <text x="1112" y="477" class="ink" font-size="20" text-anchor="middle">店舗立地</text>

    <text x="103" y="567" class="ink" font-size="20" font-weight="700" text-anchor="middle">連鎖化</text>
    <text x="103" y="595" class="ink" font-size="20" font-weight="700" text-anchor="middle">事業者</text>
    <text x="260" y="579" class="ink" font-size="20" text-anchor="middle">店舗別配送頻度</text>
    <text x="458" y="567" class="ink" font-size="19" text-anchor="middle">発注ロット</text>
    <text x="458" y="596" class="ink" font-size="19" text-anchor="middle">標準化</text>
    <text x="669" y="579" class="ink" font-size="20" text-anchor="middle">本部・店舗連携会議</text>
    <text x="882" y="579" class="ink" font-size="20" text-anchor="middle">店舗別配送実績</text>
    <text x="1112" y="579" class="ink" font-size="20" text-anchor="middle">店舗規模差分</text>
  </g>

  <g id="source">
    <text x="1216" y="684" fill="#687386" font-size="15" text-anchor="end">出典：経産省「中長期計画書・定期報告書 記載事例集」（2026年3月公表）</text>
  </g>
</svg>
